spring.application.name=TindaKart API
server.port=${API_PORT:8080}

# The root .env file is intentionally compatible with Spring's properties format.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tindakart}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

tindakart.bootstrap.admin-username=${INITIAL_ADMIN_USERNAME:}
tindakart.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:}
